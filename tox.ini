[tox]
toxworkdir={env:TOXWORKDIR:{toxinidir}/.tox}
envlist =
    py3{10,11,12}-django42
    py3{10,11,12,13,14}-django52
    py3{12,13,14}-django60
    ; Commented out because it is failing and we don't care about linting this old version correctly
    ; flake8
;skip_missing_interpreters = True

[flake8]
max-line-length = 120

[gh-actions]
python =
    3.10 = py310
    3.11 = py311
    3.12 = py312
    3.13 = py313
    3.14 = py314

[testenv]
commands = python ./manage.py test
envdir = {toxworkdir}/venvs/{envname}
setenv =
    PYTHONDONTWRITEBYTECODE=1
    PYTHONWARNINGS=once
    DJANGO_SETTINGS_MODULE=tests.settings
deps =
    urlman>=1.2.0
    setuptools
    django42: django>=4.2,<4.3
    django52: django>=5.2,<5.3
    django60: django>=6.0,<6.1

[testenv:flake8]
basepython = python3.7
deps =
    flake8==3.8.4
commands =
    flake8 . --exclude=venv/,.tox/,django_lifecycle/__init__.py
